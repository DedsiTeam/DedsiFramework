name: framework-release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./global.json

      - name: Restore dependencies
        run: dotnet restore Dedsi.Framework.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Build solution
        run: dotnet build Dedsi.Framework.slnx -c Release --no-restore

      - name: Test
        run: >-
          dotnet test Dedsi.Framework.slnx -c Release --no-build
          --logger "trx;LogFileName=tests.trx"
          --collect:"XPlat Code Coverage"
          --settings tests/coverage.runsettings
          --results-directory TestResults

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn

      - name: Pack all projects
        run: |
          for csproj in $(find ./src -name "*.csproj"); do
            dotnet pack "$csproj" -c Release --no-build -o ./nupkgs -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
          done

      - name: NuGet login (Trusted Publishing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push all NuGet packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for nupkg in ./nupkgs/*.nupkg; do
            dotnet nuget push "$nupkg" -s https://api.nuget.org/v3/index.json -k "$NUGET_API_KEY"
          done
