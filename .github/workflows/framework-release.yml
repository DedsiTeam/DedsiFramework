name: framework-release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./global.json

      - name: Restore dependencies
        run: |
          for csproj in $(find ./src -name "*.csproj"); do
            dotnet restore "$csproj"
          done

      - name: Build all projects
        run: |
          for csproj in $(find ./src -name "*.csproj"); do
            dotnet build "$csproj" -c Release --no-restore
          done

      - name: Pack all projects
        run: |
          for csproj in $(find ./src -name "*.csproj"); do
            dotnet pack "$csproj" -c Release -o ./nupkgs -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
          done

      - name: NuGet login (Trusted Publishing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push all NuGet packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for nupkg in ./nupkgs/*.nupkg; do
            dotnet nuget push "$nupkg" -s https://api.nuget.org/v3/index.json -k "$NUGET_API_KEY" --skip-duplicate
          done
